<!DOCTYPE html>
<html lang="es" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detallado UY · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f0f0;--surface:#ffffff;--ink:#101010;--muted:#666666;--line:#d8d8d8;--chip:#e2e2e2;--chip-on:#101010;--chip-on-ink:#ffffff;--bar:#101010;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--surface:#1a1a1a;--ink:#f2f2f2;--muted:#9a9a9a;--line:#2e2e2e;--chip:#262626;--chip-on:#f2f2f2;--chip-on-ink:#0d0d0d;--bar:#f2f2f2}}
:root[data-theme="dark"]{--bg:#0d0d0d;--surface:#1a1a1a;--ink:#f2f2f2;--muted:#9a9a9a;--line:#2e2e2e;--chip:#262626;--chip-on:#f2f2f2;--chip-on-ink:#0d0d0d;--bar:#f2f2f2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{background:#000;color:#fff;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-top:28px;padding-bottom:28px;flex-wrap:wrap}
.logo{width:92px;height:92px;border-radius:50%;flex:none;display:block}
.brand{flex:1;min-width:220px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(38px,7vw,60px);line-height:.95;margin:0 0 6px}
.brand p{margin:0;color:#b5b5b5;font-size:16px}
.wa{display:inline-block;background:#fff;color:#000;font:600 15px var(--body);text-decoration:none;padding:11px 20px;border-radius:999px}
.wa:focus-visible,.chip:focus-visible,.cwa:focus-visible,button:focus-visible{outline:3px solid #8ab4ff;outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:600 15px var(--body);padding:9px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:24px 0 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card.off{opacity:.4}
.pic{background:#fff;aspect-ratio:3/3.6;border-bottom:4px solid var(--bar)}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.info{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cat{font-size:13px;color:var(--muted);margin:0}
h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0}
.size{font-size:14px;color:var(--muted);margin:0}
.desc{margin:4px 0 0;font-size:15px}
ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
li{font-size:13px;font-weight:500;padding:3px 9px;border-radius:4px;border:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:2px 0 0;font-style:italic}
.foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.price{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.price.ask{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.cwa{font:600 13px var(--body);color:var(--chip-on-ink);background:var(--chip-on);text-decoration:none;padding:8px 13px;border-radius:999px}
.tg{margin-top:10px;width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px var(--body);padding:9px;border-radius:6px;cursor:pointer}
footer{padding:0 0 70px;color:var(--muted);font-size:13px}
#adm{position:fixed;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);width:16px;height:16px;padding:0;border:0;border-radius:50%;background:var(--ink);opacity:.05;cursor:pointer;z-index:20}
#editbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);color:var(--chip-on-ink);padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
#editbar button{border:0;border-radius:999px;padding:8px 16px;font:600 14px var(--body);cursor:pointer;background:var(--chip-on-ink);color:var(--bar)}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}h2{font-size:23px}.desc{font-size:14px}.info{padding:12px}.wrap{padding:0 14px}.logo{width:72px;height:72px}.price{font-size:24px}}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>

const WA="https://wa.me/59898139739?text=";
const stateEl=document.getElementById("state");
let hidden=new Set((JSON.parse(stateEl.textContent).hidden)||[]);
let cur="Todos",edit=false;
const chips=document.getElementById("chips"),grid=document.getElementById("grid");
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function visible(){return DATA.filter(p=>edit||!hidden.has(p.name))}
function render(){
 const vis=visible(),cats=["Todos",...new Set(vis.map(p=>p.cat))];
 if(!cats.includes(cur))cur="Todos";
 chips.innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cur}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
 grid.innerHTML=vis.filter(p=>cur==="Todos"||p.cat===cur).map(p=>`
 <article class="card${hidden.has(p.name)?" off":""}">
  <div class="pic"><img src="${p.img}" alt="${esc(p.name)}" loading="lazy"></div>
  <div class="info">
   <p class="cat">${esc(p.cat)}</p>
   <h2>${esc(p.name)}</h2>
   <p class="size">${esc(p.size)}</p>
   <p class="desc">${esc(p.desc)}</p>
   <ul>${p.feats.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
   ${p.note?`<p class="note">${esc(p.note)}</p>`:""}
   <div class="foot">
    <span class="price ${p.price?"":"ask"}">${p.price?"$ "+esc(p.price):"Consultar precio"}</span>
    <a class="cwa" target="_blank" rel="noopener" href="${WA+encodeURIComponent("Hola, quiero consultar por "+p.name+" ("+p.size+")")}">Consultar</a>
   </div>
   ${edit?`<button class="tg" data-n="${esc(p.name)}">${hidden.has(p.name)?"Volver a mostrar":"Marcar sin stock (ocultar)"}</button>`:""}
  </div>
 </article>`).join("");
}
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cur=b.dataset.c;render()});
grid.addEventListener("click",e=>{const b=e.target.closest(".tg");if(!b)return;const n=b.dataset.n;hidden.has(n)?hidden.delete(n):hidden.add(n);bar();render()});
function bar(msg){
 let b=document.getElementById("editbar");
 if(!edit){b&&b.remove();return}
 if(!b){b=document.createElement("div");b.id="editbar";document.body.appendChild(b)}
 b.innerHTML=`<span>${msg||"Modo edición · "+hidden.size+" oculto(s)"}</span><button id="sv">Guardar</button><button id="cn">Salir</button>`;
}
document.getElementById("adm").addEventListener("click",()=>{edit=!edit;if(!edit)hidden=new Set(JSON.parse(stateEl.textContent).hidden||[]);bar();render()});
document.addEventListener("click",async e=>{
 if(e.target.id==="cn"){edit=false;hidden=new Set(JSON.parse(stateEl.textContent).hidden||[]);bar();render()}
 if(e.target.id==="sv"){
  try{
   const art=typeof claude!=="undefined"?await claude.use("artifact"):null;
   if(!art){bar("No se puede guardar desde esta vista");return}
   const s=JSON.stringify({hidden:[...hidden]});
   const c=document.documentElement.cloneNode(true);
   c.querySelector("#grid").innerHTML="";c.querySelector("#chips").innerHTML="";
   const eb=c.querySelector("#editbar");if(eb)eb.remove();
   c.querySelector("#state").textContent=s;
   bar("Guardando…");
   await art.publish("<!DOCTYPE html>\n"+c.outerHTML);
   stateEl.textContent=s;edit=false;bar();render();
  }catch(err){bar("No se pudo guardar. Solo el dueño puede editar.")}
 }
});
render();
